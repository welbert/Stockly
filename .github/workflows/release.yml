name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes for this tag
        id: notes
        # `pwsh` (PowerShell 7+), not Windows PowerShell 5.1 (`shell: powershell`)
        # — 5.1 reads a script file with no BOM using the system's legacy ANSI
        # codepage, not UTF-8, so any non-ASCII character typed literally in
        # this block (the em dash below) gets corrupted before the regex ever
        # runs. `pwsh` parses UTF-8 correctly regardless of BOM. Belt and
        # suspenders: the em dash is still built from its code point
        # (`[char]0x2014`) instead of typed literally, so this survives even
        # if the shell ever changes back.
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dash = [char]0x2014
          $content = Get-Content -Raw -Encoding UTF8 -Path "RELEASE.md"
          $pattern = "(?ms)^# Stockly $dash $([regex]::Escape($tag))[ \t]*\r?\n(.*?)(?=^# Stockly $dash |\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            Write-Error "RELEASE.md has no version section matching tag $tag - rename the 'Nao lancado' heading to it in the version-bump commit before tagging (see docs/versioning.md's Release checklist)."
            exit 1
          }
          $notes = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Sem notas de versao registradas para $tag."
          }
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding UTF8 -Value "notes<<$delimiter"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding UTF8 -Value $notes
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding UTF8 -Value $delimiter

      - name: Setup pnpm
        # No `version:` input — pnpm/action-setup v4+ errors on a mismatch
        # between this input and package.json's own `packageManager` field
        # (which already pins `pnpm@11.6.0`); the action reads that field on
        # its own when no version is given here.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Exclude build directories from Windows Defender scanning
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bora Vender ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: '--bundles nsis'
