name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes for this tag
        id: notes
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $content = Get-Content -Raw -Encoding UTF8 -Path "RELEASE.md"
          $pattern = "(?ms)^# Stockly — $([regex]::Escape($tag))[ \t]*\r?\n(.*?)(?=^# Stockly — |\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            Write-Error "RELEASE.md has no '# Stockly — $tag' section — rename '# Stockly — Não lançado' to it in the version-bump commit before tagging (see docs/versioning.md's 'Bumping the version')."
            exit 1
          }
          $notes = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Sem notas de versão registradas para $tag."
          }
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding UTF8 -Value "notes<<$delimiter"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding UTF8 -Value $notes
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding UTF8 -Value $delimiter

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Exclude build directories from Windows Defender scanning
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bora Vender ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: '--bundles nsis'
